services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devops}
      POSTGRES_DB: ${POSTGRES_DB:-devops}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password

    secrets:
      - db_password

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-devops} -d ${POSTGRES_DB:-devops}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    image: devdp-backend:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped

    expose:
      - "8000"

    environment:
      DEBUG: "FALSE"
      DB_USER: ${POSTGRES_USER:-devops}
      DB_NAME: ${POSTGRES_DB:-devops}
      DB_HOST: db
      DB_PORT: "5432"
      DB_PASSWORD_FILE: /run/secrets/db_password
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}

    secrets:
      - db_password

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    image: devdp-frontend:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://127.0.0.1/ || exit 1",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

secrets:
  db_password:
    file: ${DB_PASSWORD_FILE:?DB_PASSWORD_FILE is required}

volumes:
  postgres_data:
