name: DevDP CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  backend-checks:
    name: Backend - Lint and Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff linter
        run: ruff check app/

      - name: Run Ruff format check
        run: ruff format --check app/

      - name: Run backend tests
        run: |
          pytest tests/ \
            -v \
            --cov=app \
            --cov-report=xml

      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-${{ github.sha }}
          path: backend/coverage.xml
          retention-days: 7

  frontend-checks:
    name: Frontend - Lint Tests Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript check
        run: npm run type-check

      - name: Run frontend tests
        run: npm run test:run

      - name: Build frontend
        run: npm run build

  build:
    name: Build and Test Docker Application
    runs-on: ubuntu-latest
    needs:
      - backend-checks
      - frontend-checks

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: |
          docker build \
            --target production \
            -t devdp-backend:latest \
            ./backend

      - name: Build frontend image
        run: |
          docker build \
            --target production \
            -t devdp-frontend:latest \
            ./frontend

      - name: Pull PostgreSQL image
        run: docker pull postgres:16-alpine

      - name: Start built application
        run: |
          cat > .env.ci <<EOF
          POSTGRES_USER=devops
          POSTGRES_PASSWORD=ci_test_password
          POSTGRES_DB=devops
          EOF

          docker compose \
            --env-file .env.ci \
            -f docker-compose.deploy.yml \
            up -d

      - name: Smoke test built application
        run: |
          set -euo pipefail

          wait_for_url() {
            NAME="$1"
            URL="$2"

            for attempt in $(seq 1 40); do
              if curl \
                --fail \
                --silent \
                --show-error \
                --connect-timeout 5 \
                --max-time 10 \
                "$URL" \
                >/dev/null
              then
                echo "${NAME}: READY"
                return 0
              fi

              echo "Waiting for ${NAME}: attempt ${attempt}/40"
              sleep 3
            done

            echo "${NAME}: FAILED"

            docker compose \
              --env-file .env.ci \
              -f docker-compose.deploy.yml \
              ps

            docker compose \
              --env-file .env.ci \
              -f docker-compose.deploy.yml \
              logs --tail=100

            return 1
          }

          wait_for_url \
            "Backend" \
            "http://127.0.0.1:8000/health"

          wait_for_url \
            "Frontend" \
            "http://127.0.0.1:3000/"

          wait_for_url \
            "Frontend API proxy" \
            "http://127.0.0.1:3000/api/info"

          echo "===== BACKEND ====="
          curl -fsS http://127.0.0.1:8000/health
          echo

          echo "===== FRONTEND ====="
          curl -fsS http://127.0.0.1:3000/ >/dev/null
          echo "Frontend: OK"

          echo "===== FRONTEND API ====="
          curl -fsS http://127.0.0.1:3000/api/info
          echo

      - name: Create deployment artifact
        run: |
          docker save \
            devdp-backend:latest \
            devdp-frontend:latest \
            postgres:16-alpine \
          | gzip -n > devdp-images.tar.gz

      - name: Upload Docker artifact
        uses: actions/upload-artifact@v4
        with:
          name: devdp-images-${{ github.sha }}
          path: devdp-images.tar.gz
          retention-days: 7

      - name: Stop CI application
        if: always()
        run: |
          docker compose \
            --env-file .env.ci \
            -f docker-compose.deploy.yml \
            down -v || true

  publish:
    name: Publish Images to GHCR
    runs-on: ubuntu-latest
    needs:
      - build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Download Docker artifact
        uses: actions/download-artifact@v4
        with:
          name: devdp-images-${{ github.sha }}

      - name: Load Docker images
        run: gzip -dc devdp-images.tar.gz | docker load

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag Docker images
        run: |
          docker tag \
            devdp-backend:latest \
            ghcr.io/${{ github.repository_owner }}/devdp-backend:${{ github.sha }}

          docker tag \
            devdp-backend:latest \
            ghcr.io/${{ github.repository_owner }}/devdp-backend:latest

          docker tag \
            devdp-frontend:latest \
            ghcr.io/${{ github.repository_owner }}/devdp-frontend:${{ github.sha }}

          docker tag \
            devdp-frontend:latest \
            ghcr.io/${{ github.repository_owner }}/devdp-frontend:latest

      - name: Push backend image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/devdp-backend:${{ github.sha }}

          docker push \
            ghcr.io/${{ github.repository_owner }}/devdp-backend:latest

      - name: Push frontend image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/devdp-frontend:${{ github.sha }}

          docker push \
            ghcr.io/${{ github.repository_owner }}/devdp-frontend:latest

  deploy:
    name: Deploy to Yandex Cloud
    runs-on: ubuntu-latest

    needs:
      - build
      - publish

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: devdp-images-${{ github.sha }}

      - name: Configure SSH through monitoring bastion
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          MON_HOST: ${{ secrets.MON_HOST }}
          APP_PRIVATE_HOST: ${{ secrets.APP_PRIVATE_HOST }}
          APP_USER: ${{ secrets.APP_USER }}
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/devdp_ci
          chmod 600 ~/.ssh/devdp_ci

          cat > ~/.ssh/config <<EOF
          Host devdp-bastion
            HostName ${MON_HOST}
            User ${APP_USER}
            IdentityFile ~/.ssh/devdp_ci
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            ConnectTimeout 15
            ConnectionAttempts 3
            ServerAliveInterval 5
            ServerAliveCountMax 3

          Host devdp-app
            HostName ${APP_PRIVATE_HOST}
            User ${APP_USER}
            IdentityFile ~/.ssh/devdp_ci
            IdentitiesOnly yes
            ProxyJump devdp-bastion
            StrictHostKeyChecking accept-new
            ConnectTimeout 15
            ConnectionAttempts 3
            ServerAliveInterval 5
            ServerAliveCountMax 3
          EOF

          chmod 600 ~/.ssh/config

      - name: Wait for application server SSH
        run: |
          READY=0

          for attempt in $(seq 1 8); do
            if ssh devdp-app 'echo SSH_OK'; then
              READY=1
              break
            fi

            echo "SSH attempt ${attempt}/8 failed"
            sleep 10
          done

          test "$READY" -eq 1

      - name: Prepare application directory
        run: |
          ssh devdp-app \
            'sudo mkdir -p /opt/devdp && sudo chown ubuntu:ubuntu /opt/devdp'

      - name: Upload deployment artifact
        run: |
          SUCCESS=0

          for attempt in $(seq 1 6); do
            if scp \
              docker-compose.deploy.yml \
              devdp-images.tar.gz \
              devdp-app:/opt/devdp/
            then
              SUCCESS=1
              break
            fi

            echo "SCP attempt ${attempt}/6 failed"
            sleep 10
          done

          test "$SUCCESS" -eq 1

      - name: Deploy application
        run: |
          ssh devdp-app 'bash -s' <<'REMOTE'
          set -euo pipefail

          cd /opt/devdp

          echo "===== LOAD IMAGES ====="
          gzip -dc devdp-images.tar.gz | docker load

          if [ ! -f .env ]; then
            umask 077
            DB_PASSWORD="$(openssl rand -hex 16)"

            cat > .env <<EOF
          POSTGRES_USER=devops
          POSTGRES_PASSWORD=${DB_PASSWORD}
          POSTGRES_DB=devops
          EOF
          fi

          echo "===== START CONTAINERS ====="

          docker compose \
            -f docker-compose.deploy.yml \
            up -d --remove-orphans

          wait_for_url() {
            NAME="$1"
            URL="$2"

            for attempt in $(seq 1 40); do
              if curl \
                --fail \
                --silent \
                --show-error \
                --connect-timeout 5 \
                --max-time 10 \
                "$URL" \
                >/dev/null
              then
                echo "${NAME}: READY"
                return 0
              fi

              echo "Waiting for ${NAME}: ${attempt}/40"
              sleep 3
            done

            echo "${NAME}: FAILED"

            docker compose \
              -f docker-compose.deploy.yml \
              ps

            docker compose \
              -f docker-compose.deploy.yml \
              logs --tail=100

            return 1
          }

          echo "===== WAIT FOR SERVICES ====="

          wait_for_url \
            "Backend" \
            "http://127.0.0.1:8000/health"

          wait_for_url \
            "Frontend" \
            "http://127.0.0.1:3000/"

          wait_for_url \
            "Frontend API proxy" \
            "http://127.0.0.1:3000/api/info"

          echo "===== BACKEND ====="
          curl -fsS http://127.0.0.1:8000/health
          echo

          echo "===== FRONTEND ====="
          curl -fsS http://127.0.0.1:3000/ >/dev/null
          echo "Frontend: OK"

          echo "===== FRONTEND API ====="
          curl -fsS http://127.0.0.1:3000/api/info
          echo

          echo "===== CONTAINERS ====="

          docker compose \
            -f docker-compose.deploy.yml \
            ps
          REMOTE

      - name: External smoke tests
        env:
          APP_HOST: ${{ secrets.APP_HOST }}
        run: |
          curl \
            --retry 8 \
            --retry-delay 5 \
            --connect-timeout 15 \
            --max-time 20 \
            -fsS \
            "http://${APP_HOST}:8000/health"

          curl \
            --retry 8 \
            --retry-delay 5 \
            --connect-timeout 15 \
            --max-time 20 \
            -fsS \
            "http://${APP_HOST}:3000/" \
            >/dev/null

          echo "Deployment smoke tests passed"
