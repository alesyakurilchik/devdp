name: DevDP CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  backend-checks:
    name: Backend - Lint and Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff linter
        run: ruff check app/

      - name: Run Ruff format check
        run: ruff format --check app/

      - name: Run backend tests
        run: |
          pytest tests/ \
            -v \
            --cov=app \
            --cov-report=xml

      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-${{ github.sha }}
          path: backend/coverage.xml
          retention-days: 7

  frontend-checks:
    name: Frontend - Lint Tests Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript check
        run: npm run type-check

      - name: Run frontend tests
        run: npm run test:run

      - name: Build frontend
        run: npm run build

  build:
    name: Build and Test Docker Application
    runs-on: ubuntu-latest
    needs:
      - backend-checks
      - frontend-checks

    env:
      IMAGE_TAG: ${{ github.sha }}
      DB_PASSWORD_FILE: /tmp/devdp-db-password
      POSTGRES_USER: devops
      POSTGRES_DB: devops

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: |
          docker build \
            --target production \
            -t "devdp-backend:${IMAGE_TAG}" \
            ./backend

      - name: Build frontend image
        run: |
          docker build \
            --target production \
            -t "devdp-frontend:${IMAGE_TAG}" \
            ./frontend

      - name: Pull PostgreSQL image
        run: docker pull postgres:16-alpine

      - name: Start built application
        run: |
          set -euo pipefail

          openssl rand -hex 32 > "${DB_PASSWORD_FILE}"
          chmod 0600 "${DB_PASSWORD_FILE}"

          docker compose \
            -f docker-compose.deploy.yml \
            up -d \
            --no-build

      - name: Smoke test built application
        run: |
          set -euo pipefail

          wait_for_url() {
            NAME="$1"
            URL="$2"

            for attempt in $(seq 1 40); do
              if curl \
                --fail \
                --silent \
                --show-error \
                --connect-timeout 5 \
                --max-time 10 \
                "$URL" \
                >/dev/null
              then
                echo "${NAME}: READY"
                return 0
              fi

              echo "Waiting for ${NAME}: ${attempt}/40"
              sleep 3
            done

            echo "${NAME}: FAILED"

            docker compose \
              -f docker-compose.deploy.yml \
              ps

            docker compose \
              -f docker-compose.deploy.yml \
              logs --tail=100

            return 1
          }

          wait_for_url "Backend through Nginx" "http://127.0.0.1/health"
          wait_for_url "Frontend" "http://127.0.0.1/"
          wait_for_url "API through Nginx" "http://127.0.0.1/api/info"

          echo "===== BACKEND ====="
          curl -fsS http://127.0.0.1/health
          echo

          echo "===== FRONTEND ====="
          curl -fsS http://127.0.0.1/ >/dev/null
          echo "Frontend: OK"

          echo "===== API ====="
          curl -fsS http://127.0.0.1/api/info
          echo

      - name: Create deployment artifact
        run: |
          docker save \
            "devdp-backend:${IMAGE_TAG}" \
            "devdp-frontend:${IMAGE_TAG}" \
            postgres:16-alpine \
          | gzip -n > devdp-images.tar.gz

      - name: Upload Docker artifact
        uses: actions/upload-artifact@v4
        with:
          name: devdp-images-${{ github.sha }}
          path: devdp-images.tar.gz
          retention-days: 7

      - name: Stop CI application
        if: always()
        run: |
          docker compose \
            -f docker-compose.deploy.yml \
            down -v || true

          rm -f "${DB_PASSWORD_FILE}"

  publish:
    name: Publish Images to GHCR
    runs-on: ubuntu-latest
    needs:
      - build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Download Docker artifact
        uses: actions/download-artifact@v4
        with:
          name: devdp-images-${{ github.sha }}

      - name: Load Docker images
        run: gzip -dc devdp-images.tar.gz | docker load

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag Docker images
        run: |
          docker tag \
            "devdp-backend:${GITHUB_SHA}" \
            "ghcr.io/${{ github.repository_owner }}/devdp-backend:${GITHUB_SHA}"

          docker tag \
            "devdp-frontend:${GITHUB_SHA}" \
            "ghcr.io/${{ github.repository_owner }}/devdp-frontend:${GITHUB_SHA}"

      - name: Push backend image
        run: |
          docker push \
            "ghcr.io/${{ github.repository_owner }}/devdp-backend:${GITHUB_SHA}"

      - name: Push frontend image
        run: |
          docker push \
            "ghcr.io/${{ github.repository_owner }}/devdp-frontend:${GITHUB_SHA}"

  deploy:
    name: Deploy to Yandex Cloud
    runs-on: ubuntu-latest

    needs:
      - build
      - publish

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: devdp-images-${{ github.sha }}

      - name: Configure SSH through monitoring bastion
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          MON_HOST: ${{ secrets.MON_HOST }}
          APP_PRIVATE_HOST: ${{ secrets.APP_PRIVATE_HOST }}
          APP_USER: ${{ secrets.APP_USER }}
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/devdp_ci
          chmod 600 ~/.ssh/devdp_ci

          cat > ~/.ssh/config <<EOF
          Host devdp-bastion
            HostName ${MON_HOST}
            User ${APP_USER}
            IdentityFile ~/.ssh/devdp_ci
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            ConnectTimeout 15
            ConnectionAttempts 3
            ServerAliveInterval 5
            ServerAliveCountMax 3

          Host devdp-app
            HostName ${APP_PRIVATE_HOST}
            User ${APP_USER}
            IdentityFile ~/.ssh/devdp_ci
            IdentitiesOnly yes
            ProxyJump devdp-bastion
            StrictHostKeyChecking accept-new
            ConnectTimeout 15
            ConnectionAttempts 3
            ServerAliveInterval 5
            ServerAliveCountMax 3
          EOF

          chmod 600 ~/.ssh/config

      - name: Wait for application server SSH
        run: |
          READY=0

          for attempt in $(seq 1 8); do
            if ssh devdp-app 'echo SSH_OK'; then
              READY=1
              break
            fi

            echo "SSH attempt ${attempt}/8 failed"
            sleep 10
          done

          test "$READY" -eq 1

      - name: Prepare application directory
        run: |
          ssh devdp-app \
            'sudo mkdir -p /opt/devdp && sudo chown ubuntu:ubuntu /opt/devdp'

      - name: Upload deployment artifact
        run: |
          SUCCESS=0

          for attempt in $(seq 1 6); do
            if scp \
              docker-compose.deploy.yml \
              devdp-images.tar.gz \
              devdp-app:/opt/devdp/
            then
              SUCCESS=1
              break
            fi

            echo "SCP attempt ${attempt}/6 failed"
            sleep 10
          done

          test "$SUCCESS" -eq 1

      - name: Deploy application
        run: |
          ssh devdp-app "IMAGE_TAG='${GITHUB_SHA}' bash -s" <<'REMOTE'
          set -euo pipefail

          cd /opt/devdp

          echo "===== LOAD IMAGES ====="
          gzip -dc devdp-images.tar.gz | sudo docker load

          SECRET_DIR="/opt/devdp/secrets"
          SECRET_FILE="${SECRET_DIR}/db_password"
          LEGACY_ENV="/opt/devdp/.env"

          sudo mkdir -p "${SECRET_DIR}"
          sudo chown root:root "${SECRET_DIR}"
          sudo chmod 0700 "${SECRET_DIR}"

          if ! sudo test -s "${SECRET_FILE}"; then
            LEGACY_PASSWORD=""

            if sudo test -f "${LEGACY_ENV}"; then
              LEGACY_PASSWORD="$(
                sudo sed -n 's/^POSTGRES_PASSWORD=//p' "${LEGACY_ENV}" |
                  head -n 1
              )"
            fi

            if [ -n "${LEGACY_PASSWORD}" ]; then
              printf '%s' "${LEGACY_PASSWORD}" |
                sudo tee "${SECRET_FILE}" >/dev/null
            else
              openssl rand -hex 32 |
                sudo tee "${SECRET_FILE}" >/dev/null
            fi
          fi

          sudo chown root:root "${SECRET_FILE}"
          sudo chmod 0600 "${SECRET_FILE}"

          cat > /tmp/devdp.env <<EOF
          POSTGRES_USER=devops
          POSTGRES_DB=devops
          IMAGE_TAG=${IMAGE_TAG}
          DB_PASSWORD_FILE=/opt/devdp/secrets/db_password
          EOF

          sudo mv /tmp/devdp.env /opt/devdp/.env
          sudo chown root:root /opt/devdp/.env
          sudo chmod 0600 /opt/devdp/.env

          echo "===== START CONTAINERS ====="

          sudo docker compose \
            --env-file /opt/devdp/.env \
            -f docker-compose.deploy.yml \
            up -d \
            --no-build \
            --remove-orphans

          wait_for_url() {
            NAME="$1"
            URL="$2"

            for attempt in $(seq 1 40); do
              if curl \
                --fail \
                --silent \
                --show-error \
                --connect-timeout 5 \
                --max-time 10 \
                "$URL" \
                >/dev/null
              then
                echo "${NAME}: READY"
                return 0
              fi

              echo "Waiting for ${NAME}: ${attempt}/40"
              sleep 3
            done

            echo "${NAME}: FAILED"

            sudo docker compose \
              --env-file /opt/devdp/.env \
              -f docker-compose.deploy.yml \
              ps

            sudo docker compose \
              --env-file /opt/devdp/.env \
              -f docker-compose.deploy.yml \
              logs --tail=100

            return 1
          }

          wait_for_url \
            "Backend through Nginx" \
            "http://127.0.0.1/health"

          wait_for_url \
            "Frontend" \
            "http://127.0.0.1/"

          wait_for_url \
            "API through Nginx" \
            "http://127.0.0.1/api/info"

          echo "===== BACKEND ====="
          curl -fsS http://127.0.0.1/health
          echo

          echo "===== FRONTEND ====="
          curl -fsS http://127.0.0.1/ >/dev/null
          echo "Frontend: OK"

          echo "===== API ====="
          curl -fsS http://127.0.0.1/api/info
          echo

          echo "===== CONTAINERS ====="

          sudo docker compose \
            --env-file /opt/devdp/.env \
            -f docker-compose.deploy.yml \
            ps

          REMOTE

      - name: Post-deploy smoke tests through bastion
        env:
          APP_PRIVATE_HOST: ${{ secrets.APP_PRIVATE_HOST }}
        run: |
          echo "===== APPLICATION THROUGH PRIVATE NETWORK ====="

          ssh devdp-bastion \
            "curl --fail --silent --show-error \
            --connect-timeout 10 \
            --max-time 20 \
            http://${APP_PRIVATE_HOST}/health"

          echo
          echo "Backend through Nginx: OK"

          ssh devdp-bastion \
            "curl --fail --silent --show-error \
            --connect-timeout 10 \
            --max-time 20 \
            http://${APP_PRIVATE_HOST}/ \
            >/dev/null"

          echo "Frontend: OK"

          ssh devdp-bastion \
            "curl --fail --silent --show-error \
            --connect-timeout 10 \
            --max-time 20 \
            http://${APP_PRIVATE_HOST}/api/info \
            >/dev/null"

          echo "API proxy: OK"
          echo "Deployment smoke tests passed"

  notify:
    name: Telegram Notification
    runs-on: ubuntu-latest

    needs:
      - backend-checks
      - frontend-checks
      - build
      - publish
      - deploy

    if: ${{ always() && github.event_name == 'push' }}

    steps:
      - name: Send build and deployment result
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          BACKEND_RESULT: ${{ needs.backend-checks.result }}
          FRONTEND_RESULT: ${{ needs.frontend-checks.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}

          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
          EVENT_NAME: ${{ github.event_name }}

        run: |
          set -euo pipefail

          STATUS="✅ SUCCESS"

          if [ "$BACKEND_RESULT" != "success" ] || \
             [ "$FRONTEND_RESULT" != "success" ] || \
             [ "$BUILD_RESULT" != "success" ]; then
            STATUS="❌ FAILED"
          fi

          if [ "$BRANCH" = "main" ]; then
            if [ "$PUBLISH_RESULT" != "success" ] || \
               [ "$DEPLOY_RESULT" != "success" ]; then
              STATUS="❌ FAILED"
            fi

            DEPLOY_TEXT="Deployment: ${DEPLOY_RESULT}"
          else
            DEPLOY_TEXT="Deployment: not required for this branch"
          fi

          SHORT_SHA="${COMMIT_SHA:0:7}"

          MESSAGE="${STATUS} — DevDP CI/CD

          Repository: ${REPOSITORY}
          Branch: ${BRANCH}
          Commit: ${SHORT_SHA}

          Backend checks: ${BACKEND_RESULT}
          Frontend checks: ${FRONTEND_RESULT}
          Docker build: ${BUILD_RESULT}
          GHCR publish: ${PUBLISH_RESULT}
          ${DEPLOY_TEXT}

          Run: ${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID}"

          curl \
            --fail \
            --silent \
            --show-error \
            -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"
