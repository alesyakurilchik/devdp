- name: Create application directory
  ansible.builtin.file:
    path: /opt/devdp
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0755"

- name: Create application secrets directory
  ansible.builtin.file:
    path: /opt/devdp/secrets
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Copy production Docker Compose configuration
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../docker-compose.deploy.yml"
    dest: /opt/devdp/docker-compose.deploy.yml
    owner: ubuntu
    group: ubuntu
    mode: "0644"

- name: Get application version from Git
  ansible.builtin.command:
    cmd: git rev-parse HEAD
    chdir: "{{ playbook_dir }}/../.."
  delegate_to: localhost
  become: false
  register: application_git_sha
  changed_when: false

- name: Set application image version
  ansible.builtin.set_fact:
    application_image_tag: "{{ application_git_sha.stdout | trim }}"

- name: Create database password secret if missing
  ansible.builtin.shell: |
    set -euo pipefail

    SECRET_FILE="/opt/devdp/secrets/db_password"
    LEGACY_ENV="/opt/devdp/.env"

    if [ ! -s "${SECRET_FILE}" ]; then
      umask 077

      LEGACY_PASSWORD=""

      if [ -f "${LEGACY_ENV}" ]; then
        LEGACY_PASSWORD="$(
          sed -n 's/^POSTGRES_PASSWORD=//p' "${LEGACY_ENV}"             | head -n 1
        )"
      fi

      if [ -n "${LEGACY_PASSWORD}" ]; then
        printf '%s' "${LEGACY_PASSWORD}" > "${SECRET_FILE}"
      else
        openssl rand -hex 32 > "${SECRET_FILE}"
      fi
    fi

    chown root:root "${SECRET_FILE}"
    chmod 0444 "${SECRET_FILE}"
  args:
    executable: /bin/bash
  no_log: true
  changed_when: false

- name: Create application environment file
  ansible.builtin.copy:
    dest: /opt/devdp/.env
    owner: root
    group: root
    mode: "0600"
    content: |
      POSTGRES_USER=devops
      POSTGRES_DB=devops
      IMAGE_TAG={{ application_image_tag }}
      DB_PASSWORD_FILE=/opt/devdp/secrets/db_password

- name: Build backend image on controller
  ansible.builtin.command:
    cmd: >
      docker build
      --target production
      -t devdp-backend:{{ application_image_tag }}
      ./backend
    chdir: "{{ playbook_dir }}/../.."
  delegate_to: localhost
  become: false
  changed_when: true

- name: Build frontend image on controller
  ansible.builtin.command:
    cmd: >
      docker build
      --target production
      -t devdp-frontend:{{ application_image_tag }}
      ./frontend
    chdir: "{{ playbook_dir }}/../.."
  delegate_to: localhost
  become: false
  changed_when: true

- name: Ensure PostgreSQL image exists on controller
  ansible.builtin.command:
    cmd: docker pull postgres:16-alpine
  delegate_to: localhost
  become: false
  changed_when: false

- name: Save application images on controller
  ansible.builtin.shell: |
    set -euo pipefail

    docker save \
      devdp-backend:{{ application_image_tag }} \
      devdp-frontend:{{ application_image_tag }} \
      postgres:16-alpine \
      | gzip -n > /tmp/devdp-images.tar.gz
  args:
    executable: /bin/bash
  delegate_to: localhost
  become: false
  changed_when: true

- name: Copy application images to application server
  ansible.builtin.copy:
    src: /tmp/devdp-images.tar.gz
    dest: /tmp/devdp-images.tar.gz
    mode: "0644"

- name: Load application images
  ansible.builtin.shell: |
    set -euo pipefail
    gzip -dc /tmp/devdp-images.tar.gz | docker load
  args:
    executable: /bin/bash
  register: docker_load
  changed_when: "'Loaded image' in docker_load.stdout"

- name: Remove stale Docker Compose temporary containers
  ansible.builtin.shell: |
    docker ps -a \
      | awk 'NR > 1 {print $NF}' \
      | grep -E '^[0-9a-f]{12}_devdp-(backend|frontend|db)-1$' \
      | xargs -r docker rm -f
  args:
    executable: /bin/bash
  changed_when: false

- name: Start production application
  ansible.builtin.command:
    cmd: >
      docker compose
      --env-file .env
      -f docker-compose.deploy.yml
      up -d
      --no-build
      --remove-orphans
    chdir: /opt/devdp
  register: compose_up
  changed_when: >
    'Created' in compose_up.stdout or
    'Started' in compose_up.stdout or
    'Recreated' in compose_up.stdout

- name: Wait for application health endpoint
  ansible.builtin.uri:
    url: http://127.0.0.1/health
    status_code: 200
  register: application_health
  retries: 40
  delay: 3
  until: application_health.status == 200

- name: Wait for frontend
  ansible.builtin.uri:
    url: http://127.0.0.1/
    status_code: 200
  register: frontend_health
  retries: 40
  delay: 3
  until: frontend_health.status == 200
